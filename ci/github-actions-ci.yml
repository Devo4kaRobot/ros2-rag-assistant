name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # тестам не нужны torch и модели: поиск и LLM подменяются фиктивными
      - run: pip install numpy pyyaml pytest
      - name: Build corpus (нужен тесту целостности тестового набора)
        run: |
          D=data/raw/ros2_documentation
          mkdir -p $D && git -C $D init -q
          git -C $D fetch -q --depth 1 https://github.com/ros2/ros2_documentation.git 08601b3c41cf4be349eae5774bc92a9594788641
          git -C $D checkout -q FETCH_HEAD
          python src/rag/build_corpus.py
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (без публикации)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ros2-rag-assistant:ci
